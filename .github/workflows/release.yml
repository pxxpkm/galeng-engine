name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  author-zip:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Test
        run: |
          cargo test --workspace
          pnpm test

      - name: Pack author folder
        run: cmd /c pack-author.bat

      - name: Zip and checksum
        id: zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          if (-not $ver) { throw "empty version" }
          $name = "galeng-editor-$ver-windows-x64.zip"
          if (-not (Test-Path "out\galeng-editor\Galeng.bat")) {
            throw "pack-author.bat did not write out\galeng-editor\Galeng.bat"
          }
          if (Test-Path $name) { Remove-Item $name -Force }
          Compress-Archive -Path "out\galeng-editor" -DestinationPath $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "SHA256SUMS.txt" -Value "$hash  $name" -NoNewline
          "asset=$name" >> $env:GITHUB_OUTPUT
          Get-Item $name | Format-List Name, Length
          Get-Content SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.zip.outputs.asset }}
            SHA256SUMS.txt
          body: |
            Author pack for Windows x64. Unzip and double-click `galeng-editor/Galeng.bat`.
            Open http://127.0.0.1:3847 (not localhost). No Rust or pnpm required.

            作者包（Windows x64）。解壓後雙擊 `galeng-editor/Galeng.bat`。
            瀏覽器開 http://127.0.0.1:3847（不要 localhost）。不必裝 Rust／pnpm。

            The Source code zip attached by GitHub is the repo, not the editor.
            GitHub 自動附上的 Source code 是源碼，不是作者包。
