[package]
name = "galeng-packer"
version = "0.1.3"
edition.workspace = true
license.workspace = true
description = "Pack a Galeng project into a zip-compatible game.pak"

[[bin]]
name = "galeng-packer"
path = "src/main.rs"

[dependencies]
galeng-schema = { path = "../schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
