[package]
name = "galeng-player"
version = "0.1.3"
edition.workspace = true
license.workspace = true
description = "Native Galeng player (M1: software FB + SDL2 present)"

[[bin]]
name = "galeng-player"
path = "src/main.rs"

[dependencies]
galeng-schema = { path = "../schema" }
galeng-packer = { path = "../packer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
rodio = { version = "0.21", default-features = false, features = ["wav", "vorbis", "playback"] }
sdl2 = { version = "0.37", default-features = false }
thiserror = "2"
unicode-segmentation = "1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# none
